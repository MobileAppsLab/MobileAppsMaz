<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<title>MobilApps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:24px 18px 32px}
h1{text-align:center;font-size:34px;margin:8px 0 4px}.sub{text-align:center;color:#6b7280;margin:0 0 28px}
.screen{display:none}.screen.active{display:block}h2{margin:5px 0 20px}
.menu{width:100%;padding:20px;margin:9px 0;border:0;border-radius:15px;background:#1f2937;color:white;text-align:left;font-size:20px;font-weight:700;cursor:pointer}
.menu span{font-size:29px;margin-right:12px}label{display:block;font-weight:700;margin:17px 0 8px}
input{width:100%;padding:15px;border:2px solid #d1d5db;border-radius:12px;font-size:22px;outline:0}
.tipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tip{padding:14px 3px;border:2px solid #d1d5db;background:#fff;border-radius:11px;font-size:17px;font-weight:700}.tip.sel,.unit.sel{background:#1f2937;color:#fff;border-color:#1f2937}
.calc{width:100%;padding:17px;margin-top:20px;border:0;border-radius:13px;background:#1f2937;color:white;font-size:19px;font-weight:700;cursor:pointer}
.back{width:100%;padding:15px;margin-top:22px;border:0;border-radius:13px;background:#e5e7eb;font-size:17px;font-weight:700;cursor:pointer}
.result{margin-top:20px;padding:19px;border-radius:14px;background:#f3f4f6;font-size:19px;line-height:1.8}.total{font-size:24px;font-weight:800}
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}.unit{padding:15px 4px;border:2px solid #d1d5db;background:white;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.error{display:none;color:#b91c1c;font-weight:600;margin-top:9px}
</style>
</head>
<body>
<div class="app">
<h1>MobilApps</h1>

<section id="home" class="screen active">
<p class="sub">Simple tools for everyday use</p>
<button class="menu" onclick="show('tip')"><span>💵</span>Tip Calculator</button>
<button class="menu" onclick="show('temp')"><span>🌡️</span>Temperature Converter</button>
<button class="menu" onclick="openMazatlan()"><span>🌴</span>Mazatlan Life</button>
</section>

<section id="tip" class="screen">
<h2>Tip Calculator</h2>
<label for="bill">Enter Full Bill Amount</label>
<input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$0.00">
<label>Select Tip Percentage</label>
<div class="tipgrid">
<button class="tip" data-v="10" onclick="tip(10)">10%</button>
<button class="tip" data-v="12" onclick="tip(12)">12%</button>
<button class="tip" data-v="15" onclick="tip(15)">15%</button>
<button class="tip" data-v="17" onclick="tip(17)">17%</button>
<button class="tip" data-v="20" onclick="tip(20)">20%</button>
<button class="tip" data-v="custom" onclick="customTip()">Custom</button>
</div>
<div id="custom" style="display:none">
<label for="customPct">Custom Tip Percentage</label>
<input id="customPct" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Enter percentage">
</div>
<div id="tipErr" class="error"></div>
<button class="calc" onclick="calcTip()">Calculate Tip</button>
<div id="tipResult" class="result" style="display:none"></div>
<button class="back" onclick="show('home')">← Back to Main Menu</button>
</section>

<section id="temp" class="screen">
<h2>Temperature Converter</h2>
<label for="tempInput">Enter Temperature</label>
<input id="tempInput" type="number" inputmode="decimal" step="any" placeholder="Enter temperature">
<label>Convert From</label>
<div class="units">
<button id="f" class="unit sel" onclick="unit('F')">°F Fahrenheit</button>
<button id="c" class="unit" onclick="unit('C')">°C Celsius</button>
</div>
<div id="tempErr" class="error"></div>
<button class="calc" onclick="convert()">Convert</button>
<div id="tempResult" class="result" style="display:none"></div>
<button class="back" onclick="show('home')">← Back to Main Menu</button>
</section>
</div>

<script>
let pct=15,from='F';
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function openMazatlan(){window.location.href='https://mazatlanlife.com/';}
function tip(v){pct=v;document.querySelectorAll('.tip').forEach(x=>x.classList.remove('sel'));document.querySelector('[data-v="'+v+'"]').classList.add('sel');document.getElementById('custom').style.display='none'}
function customTip(){pct='custom';document.querySelectorAll('.tip').forEach(x=>x.classList.remove('sel'));document.querySelector('[data-v="custom"]').classList.add('sel');document.getElementById('custom').style.display='block'}
function money(n){return '$'+n.toFixed(2)}
function calcTip(){
let b=parseFloat(document.getElementById('bill').value),p=pct==='custom'?parseFloat(document.getElementById('customPct').value):pct,e=document.getElementById('tipErr');
if(!Number.isFinite(b)||b<0){e.textContent='Please enter a valid bill amount.';e.style.display='block';return}
if(!Number.isFinite(p)||p<0){e.textContent='Please enter a valid tip percentage.';e.style.display='block';return}
e.style.display='none';let t=b*p/100,total=b+t;
document.getElementById('tipResult').innerHTML='Your bill was: <strong>'+money(b)+'</strong><br>Your tip is: <strong>'+money(t)+'</strong><br><div class="total">Your total bill will be: '+money(total)+'</div>';
document.getElementById('tipResult').style.display='block'}
function unit(x){from=x;document.getElementById('f').classList.toggle('sel',x==='F');document.getElementById('c').classList.toggle('sel',x==='C')}
function convert(){
let v=parseFloat(document.getElementById('tempInput').value),e=document.getElementById('tempErr');
if(!Number.isFinite(v)){e.textContent='Please enter a valid temperature.';e.style.display='block';return}
e.style.display='none';let r=from==='F'?(v-32)*5/9:v*9/5+32;
document.getElementById('tempResult').innerHTML='<strong>'+v.toFixed(1)+'°'+from+'</strong> = <strong>'+r.toFixed(1)+'°'+(from==='F'?'C':'F')+'</strong>';
document.getElementById('tempResult').style.display='block'}
</script>
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js')}</script>
</body>
</html>
